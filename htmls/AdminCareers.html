<div class="cz-site cz-admin" id="cz-site" data-theme="light" style="{plhd_style}">
<header class="cz-ahead">
    <button type="button" class="cz-ibtn cz-burger" aria-label="Menu" onclick="AdminCareersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="cz-abrand" href="Admin"><svg class="cz-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--cz-accent)"/><path d="M11 10h18M11 30h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 14l16 3-16 3 16 3-16 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b>{plhd_name}</b><span>Admin</span></a>
    <span class="cz-grow"></span>
    <a class="cz-who" id="cz-who" href="AdminAccount"></a>
    <a class="cz-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="cz-out" onclick="AdminCareersJs.signOut()">Sign out</button>
</header>
<aside class="cz-side" id="cz-nav" aria-label="Admin">
    <div class="cz-nav-top"><span>Menu</span><button type="button" class="cz-ibtn" aria-label="Close" onclick="AdminCareersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="cz-amenu" id="cz-menu"></ul>
</aside>
<div class="cz-scrim" id="cz-scrim" onclick="AdminCareersJs.closeNav()"></div>
<main class="cz-amain" id="cz-main"><p class="cz-loading">Loading&hellip;</p></main>
<div class="cz-modal" id="cz-modal" onclick="if(event.target===this)AdminCareersJs.closeModal()">
    <div class="cz-mbox" role="dialog" aria-modal="true"><button type="button" class="cz-ibtn cz-mclose" aria-label="Close" onclick="AdminCareersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="cz-mbody"></div></div>
</div>
<div class="cz-toast" id="cz-toast" role="status" aria-live="polite"></div>
</div>
