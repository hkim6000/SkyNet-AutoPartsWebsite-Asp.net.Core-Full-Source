<div class="dl-site dl-admin" id="dl-site" data-theme="light" style="{plhd_style}">
<header class="dl-ahead">
    <button type="button" class="dl-ibtn dl-burger" aria-label="Menu" onclick="AdminDealersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="dl-abrand" href="Admin"><svg class="dl-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--dl-accent)"/><path d="M11 10h18M11 30h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 14l16 3-16 3 16 3-16 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b>{plhd_name}</b><span>Admin</span></a>
    <span class="dl-grow"></span>
    <a class="dl-who" id="dl-who" href="AdminAccount"></a>
    <a class="dl-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="dl-out" onclick="AdminDealersJs.signOut()">Sign out</button>
</header>
<aside class="dl-side" id="dl-nav" aria-label="Admin">
    <div class="dl-nav-top"><span>Menu</span><button type="button" class="dl-ibtn" aria-label="Close" onclick="AdminDealersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="dl-amenu" id="dl-menu"></ul>
</aside>
<div class="dl-scrim" id="dl-scrim" onclick="AdminDealersJs.closeNav()"></div>
<main class="dl-amain" id="dl-main"><p class="dl-loading">Loading&hellip;</p></main>
<div class="dl-modal" id="dl-modal" onclick="if(event.target===this)AdminDealersJs.closeModal()">
    <div class="dl-mbox" role="dialog" aria-modal="true"><button type="button" class="dl-ibtn dl-mclose" aria-label="Close" onclick="AdminDealersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="dl-mbody"></div></div>
</div>
<div class="dl-toast" id="dl-toast" role="status" aria-live="polite"></div>
</div>
