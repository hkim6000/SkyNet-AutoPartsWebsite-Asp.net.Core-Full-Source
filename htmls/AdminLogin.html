<div class="lg-site lg-login" id="lg-site" data-theme="light" style="{plhd_style}">
<img class="lg-lbg" src="images/scenes/hero-plant.webp" alt="">
<main class="lg-main lg-lwrap">
    <div class="lg-lcard">
        <a class="lg-lbrand" href="Home"><svg class="lg-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--lg-accent)"/><path d="M11 10h18M11 30h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 14l16 3-16 3 16 3-16 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b>{plhd_brand}</b><span>Admin</span></a>
        <h1>Admin sign in</h1>
        <form class="lg-lform" onsubmit="return AdminLoginJs.signIn()" novalidate>
            <label class="lg-field" for="lg-user"><span>User name</span><input type="text" id="lg-user" maxlength="40" autocomplete="username" autocapitalize="none" value="{plhd_user}"></label>
            <label class="lg-field" for="lg-pass"><span>Password</span><input type="password" id="lg-pass" maxlength="100" autocomplete="current-password" value="{plhd_pass}"></label>
            <em class="lg-err" id="lg-e-pass" role="alert"></em>
            <button type="submit" class="lg-btn lg-btn-wide" id="lg-lgo">Sign in</button>
            {plhd_hint}
        </form>
        <a class="lg-lback" href="Home">&larr; Back to the website</a>
    </div>
</main>
</div>
