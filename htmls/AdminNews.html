<div class="nz-site nz-admin" id="nz-site" data-theme="light" style="{plhd_style}">
<header class="nz-ahead">
    <button type="button" class="nz-ibtn nz-burger" aria-label="Menu" onclick="AdminNewsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="nz-abrand" href="Admin"><svg class="nz-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--nz-accent)"/><path d="M11 10h18M11 30h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 14l16 3-16 3 16 3-16 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b>{plhd_name}</b><span>Admin</span></a>
    <span class="nz-grow"></span>
    <a class="nz-who" id="nz-who" href="AdminAccount"></a>
    <a class="nz-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="nz-out" onclick="AdminNewsJs.signOut()">Sign out</button>
</header>
<aside class="nz-side" id="nz-nav" aria-label="Admin">
    <div class="nz-nav-top"><span>Menu</span><button type="button" class="nz-ibtn" aria-label="Close" onclick="AdminNewsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="nz-amenu" id="nz-menu"></ul>
</aside>
<div class="nz-scrim" id="nz-scrim" onclick="AdminNewsJs.closeNav()"></div>
<main class="nz-amain" id="nz-main"><p class="nz-loading">Loading&hellip;</p></main>
<div class="nz-modal" id="nz-modal" onclick="if(event.target===this)AdminNewsJs.closeModal()">
    <div class="nz-mbox" role="dialog" aria-modal="true"><button type="button" class="nz-ibtn nz-mclose" aria-label="Close" onclick="AdminNewsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="nz-mbody"></div></div>
</div>
<div class="nz-toast" id="nz-toast" role="status" aria-live="polite"></div>
</div>
