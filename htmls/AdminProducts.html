<div class="pz-site pz-admin" id="pz-site" data-theme="light" style="{plhd_style}">
<header class="pz-ahead">
    <button type="button" class="pz-ibtn pz-burger" aria-label="Menu" onclick="AdminProductsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pz-abrand" href="Admin"><svg class="pz-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--pz-accent)"/><path d="M11 10h18M11 30h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 14l16 3-16 3 16 3-16 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b>{plhd_name}</b><span>Admin</span></a>
    <span class="pz-grow"></span>
    <a class="pz-who" id="pz-who" href="AdminAccount"></a>
    <a class="pz-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pz-out" onclick="AdminProductsJs.signOut()">Sign out</button>
</header>
<aside class="pz-side" id="pz-nav" aria-label="Admin">
    <div class="pz-nav-top"><span>Menu</span><button type="button" class="pz-ibtn" aria-label="Close" onclick="AdminProductsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="pz-amenu" id="pz-menu"></ul>
</aside>
<div class="pz-scrim" id="pz-scrim" onclick="AdminProductsJs.closeNav()"></div>
<main class="pz-amain" id="pz-main"><p class="pz-loading">Loading&hellip;</p></main>
<div class="pz-modal" id="pz-modal" onclick="if(event.target===this)AdminProductsJs.closeModal()">
    <div class="pz-mbox" role="dialog" aria-modal="true"><button type="button" class="pz-ibtn pz-mclose" aria-label="Close" onclick="AdminProductsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="pz-mbody"></div></div>
</div>
<div class="pz-toast" id="pz-toast" role="status" aria-live="polite"></div>
</div>
