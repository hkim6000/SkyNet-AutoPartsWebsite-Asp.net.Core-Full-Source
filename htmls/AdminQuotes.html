<div class="qt-site qt-admin" id="qt-site" data-theme="light" style="{plhd_style}">
<header class="qt-ahead">
    <button type="button" class="qt-ibtn qt-burger" aria-label="Menu" onclick="AdminQuotesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="qt-abrand" href="Admin"><svg class="qt-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--qt-accent)"/><path d="M11 10h18M11 30h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M12 14l16 3-16 3 16 3-16 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg><b>{plhd_name}</b><span>Admin</span></a>
    <span class="qt-grow"></span>
    <a class="qt-who" id="qt-who" href="AdminAccount"></a>
    <a class="qt-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="qt-out" onclick="AdminQuotesJs.signOut()">Sign out</button>
</header>
<aside class="qt-side" id="qt-nav" aria-label="Admin">
    <div class="qt-nav-top"><span>Menu</span><button type="button" class="qt-ibtn" aria-label="Close" onclick="AdminQuotesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="qt-amenu" id="qt-menu"></ul>
</aside>
<div class="qt-scrim" id="qt-scrim" onclick="AdminQuotesJs.closeNav()"></div>
<main class="qt-amain" id="qt-main"><p class="qt-loading">Loading&hellip;</p></main>
<div class="qt-modal" id="qt-modal" onclick="if(event.target===this)AdminQuotesJs.closeModal()">
    <div class="qt-mbox" role="dialog" aria-modal="true"><button type="button" class="qt-ibtn qt-mclose" aria-label="Close" onclick="AdminQuotesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="qt-mbody"></div></div>
</div>
<div class="qt-toast" id="qt-toast" role="status" aria-live="polite"></div>
</div>
